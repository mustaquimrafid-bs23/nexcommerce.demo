<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Account &mdash; nexCommerce</title>
  <meta name="description" content="Manage your nexCommerce orders, delivery addresses, and AI style preference signals.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .account-page-bg {
      background: var(--bg-main);
      min-height: 100vh;
    }
    .account-top-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 40px 0;
    }
    .account-main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px 80px;
    }
    @media (max-width: 900px) {
      .account-top-bar { padding: 32px 16px 0; }
      .account-main-wrapper { padding: 0 16px 80px; }
    }
  </style>
</head>
<body class="account-page-bg">

  <!-- GLOBAL HEADER -->
  <header class="site-header" id="siteHeader">
    <div class="nav-inner container">
      <a href="index.html" class="nav-logo">nexCommerce</a>
      <nav class="nav-left nav-menu-links">
        <a href="category.html" class="nav-item-link">SHOP</a>
        <a href="discovery.html" class="nav-item-link">DISCOVER</a>
        <a href="profile.html" class="nav-item-link">AI PROFILE</a>
        <a href="account.html" class="nav-item-link active">ACCOUNT</a>
      </nav>
      <div class="nav-right" style="display: flex; align-items: center; gap: 20px;">
        <button class="search-trigger" id="searchTriggerBtn" style="background: none; border: none; color: var(--text-secondary); font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px;">
          <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:-0.125em; margin-right:4px;"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span><span>SEARCH</span>
        </button>
        <button onclick="window.nexNotifications.toggleDrawer()" style="background: none; border: none; color: var(--text-primary); cursor: pointer; font-family: var(--font-body); font-size: 13px; display: flex; align-items: center; gap: 6px; position: relative;" aria-label="Notifications">
          <span>🔔</span>
          <span id="headerNotifBadge" style="background: var(--accent-cyan); color: var(--bg-main); font-size: 10px; font-weight: 700; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;">3</span>
        </button>
        <a href="cart.html" style="color: var(--text-primary); text-decoration: none; font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; display: flex; align-items: center; gap: 6px;">
          <span>BAG</span>
          <span class="bag-badge" id="headerCartCount">1</span>
        </a>
      </div>
    </div>
  </header>

  <main id="accountMain" class="account-top-bar">
    <div class="account-main-wrapper" id="accountMainContent">
      <!-- Dynamically rendered by js/account.js -->
      <div style="min-height: 400px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary);">
        Loading account data...
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer style="background: var(--bg-main); border-top: 1px solid var(--border-subtle); padding: 40px 0; color: var(--text-secondary); font-family: var(--font-body); font-size: 13px;">
    <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
      <div style="font-family: var(--font-serif); font-size: 22px; color: var(--text-primary);">nexCommerce</div>
      <div style="display: flex; gap: 24px;">
        <a href="index.html" style="color: var(--text-secondary); text-decoration: none;">Home</a>
        <a href="category.html" style="color: var(--text-secondary); text-decoration: none;">Shop</a>
        <a href="account.html" style="color: var(--text-secondary); text-decoration: none;">Account</a>
        <a href="tracking.html" style="color: var(--text-secondary); text-decoration: none;">Tracking</a>
      </div>
      <div>© 2026 nexCommerce. All rights reserved.</div>
    </div>
  </footer>

  <script src="js/cart.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/account.js"></script>
  <script src="js/theme-switcher.js"></script>
</body>
</html>
